<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Light Tracker</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-start: #0f2027;
            --bg-mid: #203a43;
            --bg-end: #2c5364;
            --accent: #fdd835;
            --text-main: #ffffff;
            --text-dim: #cfd8dc;
            --card-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            background: linear-gradient(to bottom, var(--bg-start), var(--bg-mid), var(--bg-end));
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* Loading State */
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Header */
        .header {
            margin-top: 50px;
            text-align: center;
            padding: 0 20px;
        }
        .header h1 {
            font-weight: 300;
            font-size: 0.9rem;
            margin: 0;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .header .big-stat {
            font-size: 3rem;
            font-weight: 700;
            margin: 5px 0;
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Cards */
        .container {
            width: 90%;
            max-width: 420px;
            margin-top: 20px;
            padding-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        /* Data Rows */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .stat-row:last-child { margin-bottom: 0; }
        .label { font-size: 1rem; color: var(--text-dim); }
        .value { font-size: 1.1rem; font-weight: 600; }
        .highlight { color: var(--accent); }

        /* Graph */
        .graph-container {
            height: 220px;
            width: 100%;
        }

        /* Future List */
        .future-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .future-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
        }
        .future-item:last-child { border-bottom: none; }
        .future-date { 
            color: var(--text-dim); 
            font-size: 0.85rem;
            width: 80px;
        }
        .future-detail { 
            font-weight: 500; 
            flex-grow: 1;
            text-align: right;
        }
        .icon { margin-right: 8px; font-size: 1.1rem; }

        /* Footer Message */
        .footer-msg {
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="loader">Fetching Forecast...</div>

    <div id="app-content" style="display:none; width: 100%; display: flex; flex-direction: column; align-items: center;">
        
        <div class="header">
            <h1>The Light Returns</h1>
            <div class="big-stat" id="gain-text">--</div>
            <div style="font-size: 0.95rem; color: var(--text-dim);">more daylight than yesterday</div>
        </div>

        <div class="container">
            
            <div class="card">
                <div class="stat-row">
                    <span class="label">Sunrise / Sunset</span>
                    <span class="value" id="sun-today">-- / --</span>
                </div>
                <div class="stat-row">
                    <span class="label">Daylight Total</span>
                    <span class="value" id="daylight-total">-- hr -- min</span>
                </div>
                <div class="stat-row">
                    <span class="label">Forecast High</span>
                    <span class="value" id="temp-today">--°F</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">16-Day Forecast Trend</div>
                <div class="graph-container">
                    <canvas id="hopeChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Upcoming Milestones</div>
                <ul class="future-list" id="milestones-list">
                    </ul>
            </div>

            <div class="footer-msg">
                Live forecast data for New York, NY
            </div>
        </div>
    </div>

    <script>
        // CONFIG: New York, NY coordinates
        const LAT = 40.7128;
        const LON = -74.0060;
        const TIMEZONE = "America/New_York";

        async function fetchData() {
            try {
                // Fetch 16 days of forecast data
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=temperature_2m_max,sunrise,sunset,daylight_duration&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timeformat=unixtime&forecast_days=16&timezone=${TIMEZONE}`);
                const data = await response.json();
                renderApp(data);
            } catch (error) {
                document.getElementById('loader').innerText = "Error loading weather data.";
                console.error(error);
            }
        }

        function formatTime(unixTime) {
            const date = new Date(unixTime * 1000);
            return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }

        function formatDate(unixTime) {
            const date = new Date(unixTime * 1000);
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function renderApp(data) {
            const daily = data.daily;
            
            // 1. Calculate Daylight Gain (Tomorrow - Today)
            const todayDuration = daily.daylight_duration[0];
            const tomorrowDuration = daily.daylight_duration[1];
            const diffSeconds = tomorrowDuration - todayDuration;
            const diffMinutes = Math.floor(diffSeconds / 60);
            const diffSecsRem = Math.floor(diffSeconds % 60);

            document.getElementById('gain-text').innerText = `+${diffMinutes}m ${diffSecsRem}s`;
            
            // 2. Today's Details
            const sr = formatTime(daily.sunrise[0]);
            const ss = formatTime(daily.sunset[0]);
            document.getElementById('sun-today').innerText = `${sr} / ${ss}`;
            document.getElementById('temp-today').innerText = Math.round(daily.temperature_2m_max[0]) + "°F";
            
            const hrs = Math.floor(todayDuration / 3600);
            const mins = Math.floor((todayDuration % 3600) / 60);
            document.getElementById('daylight-total').innerText = `${hrs}h ${mins}m`;

            // 3. Milestones Calculation
            const milestonesList = document.getElementById('milestones-list');
            const milestones = [];

            // Helper: Convert unix time to minutes from midnight
            const getMins = (unix) => {
                const d = new Date(unix * 1000);
                return d.getHours() * 60 + d.getMinutes();
            };

            // Define Targets
            // Sunsets: We want to see when it sets AFTER these times
            const sunsetTargets = [
                { hour: 17, min: 0, label: "5:00 PM", found: false },
                { hour: 17, min: 15, label: "5:15 PM", found: false },
                { hour: 17, min: 30, label: "5:30 PM", found: false },
                { hour: 17, min: 45, label: "5:45 PM", found: false },
                { hour: 18, min: 0, label: "6:00 PM", found: false }
            ];

            // Sunrises: We want to see when it rises BEFORE these times
            const sunriseTargets = [
                { hour: 7, min: 30, label: "7:30 AM", found: false },
                { hour: 7, min: 15, label: "7:15 AM", found: false },
                { hour: 7, min: 0, label: "7:00 AM", found: false },
                { hour: 6, min: 45, label: "6:45 AM", found: false },
                { hour: 6, min: 30, label: "6:30 AM", found: false }
            ];

            // Scan the 16 day forecast
            for (let i = 0; i < daily.time.length; i++) {
                const daySunsetMins = getMins(daily.sunset[i]);
                const daySunriseMins = getMins(daily.sunrise[i]);

                // Check Sunsets (Getting Later)
                sunsetTargets.forEach(t => {
                    const targetMins = t.hour * 60 + t.min;
                    // If sunset is AFTER target
                    if (daySunsetMins >= targetMins && !t.found) {
                        milestones.push({
                            date: i === 0 ? "Today" : formatDate(daily.time[i]),
                            text: `Sunset after ${t.label}`,
                            icon: "🌇"
                        });
                        t.found = true;
                    }
                });

                // Check Sunrises (Getting Earlier)
                sunriseTargets.forEach(t => {
                    const targetMins = t.hour * 60 + t.min;
                    // If sunrise is BEFORE target
                    if (daySunriseMins <= targetMins && !t.found) {
                        milestones.push({
                            date: i === 0 ? "Today" : formatDate(daily.time[i]),
                            text: `Sunrise before ${t.label}`,
                            icon: "🌅"
                        });
                        t.found = true;
                    }
                });
            }

            // Sort milestones by date (closest first)
            // Note: The loop naturally adds them in order, but we might hit a sunrise and sunset on the same day.
            // No extra sort needed because 'i' (days) is the main loop.

            // Limit to 5 items to keep UI clean
            const finalMilestones = milestones.slice(0, 5);

            // Render Milestones
            if(finalMilestones.length === 0) {
                 milestonesList.innerHTML = `<li class="future-item"><span class="future-detail">Days are getting longer...</span></li>`;
            } else {
                finalMilestones.forEach(m => {
                    const li = document.createElement('li');
                    li.className = 'future-item';
                    li.innerHTML = `
                        <span class="future-date">${m.date}</span>
                        <div style="display:flex; align-items:center; justify-content:flex-end; flex-grow:1;">
                            <span class="icon">${m.icon}</span>
                            <span class="future-detail" style="text-align:right;">${m.text}</span>
                        </div>
                    `;
                    milestonesList.appendChild(li);
                });
            }

            // 4. Chart.js Graph
            const ctx = document.getElementById('hopeChart').getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(253, 216, 53, 0.4)'); 
            gradient.addColorStop(1, 'rgba(253, 216, 53, 0.0)'); 

            const labels = daily.time.map(t => new Date(t*1000).getDate()); 
            const temps = daily.temperature_2m_max.map(t => Math.round(t));

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Max Temp (°F)',
                        data: temps,
                        borderColor: '#fdd835',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 3,
                        pointBackgroundColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    return formatDate(daily.time[context[0].dataIndex]);
                                }
                            }
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: { display: false, min: Math.min(...temps) - 5 }
                    },
                    layout: { padding: 10 }
                }
            });

            // Reveal App
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app-content').style.display = 'flex';
        }

        // Start
        fetchData();

    </script>
</body>
</html>
