<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Light Tracker">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Light Tracker</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☀️</text></svg>">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-start: #0f2027;
            --bg-mid: #203a43;
            --bg-end: #2c5364;
            --accent: #fdd835;
            --text-main: #ffffff;
            --text-dim: #cfd8dc;
            --card-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            background: linear-gradient(to bottom, var(--bg-start), var(--bg-mid), var(--bg-end));
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        .header {
            margin-top: 50px;
            text-align: center;
            padding: 0 20px;
        }
        .header h1 {
            font-weight: 300;
            font-size: 0.9rem;
            margin: 0;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .header .big-stat {
            font-size: 3rem;
            font-weight: 700;
            margin: 5px 0;
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            width: 90%;
            max-width: 420px;
            margin-top: 20px;
            padding-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .stat-row:last-child { margin-bottom: 0; }
        .label { font-size: 1rem; color: var(--text-dim); }
        .value { font-size: 1.1rem; font-weight: 600; }

        /* DST COUNTDOWN STYLES */
        .dst-row {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: 10px;
        }
        .dst-box {
            display: flex;
            flex-direction: column;
        }
        .dst-num {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            font-feature-settings: "tnum"; /* Monospace numbers */
        }
        .dst-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .graph-container {
            height: 220px;
            width: 100%;
        }

        .future-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .future-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
        }
        .future-item:last-child { border-bottom: none; }
        .future-date { 
            color: var(--text-dim); 
            font-size: 0.85rem;
            width: 70px;
            flex-shrink: 0;
        }
        .future-detail { 
            font-weight: 500; 
            flex-grow: 1;
            text-align: right;
            white-space: nowrap;
        }
        .icon { margin-right: 8px; font-size: 1.1rem; }

        .footer-msg {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            margin-top: 30px;
        }
        
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div id="loader">Calculating...</div>

    <div id="app-content" style="display:none; width: 100%; display: flex; flex-direction: column; align-items: center;">
        
        <div class="header">
            <h1>The Light Returns</h1>
            <div class="big-stat" id="gain-text">--</div>
            <div style="font-size: 0.95rem; color: var(--text-dim);">more daylight than yesterday</div>
        </div>

        <div class="container">
            
            <div class="card">
                <div class="stat-row">
                    <span class="label">Sunrise / Sunset</span>
                    <span class="value" id="sun-today">-- / --</span>
                </div>
                <div class="stat-row">
                    <span class="label">Daylight Total</span>
                    <span class="value" id="daylight-total">-- hr -- min</span>
                </div>
                <div class="stat-row">
                    <span class="label">Forecast High</span>
                    <span class="value" id="temp-today">--°F</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Daylight Savings (Spring Forward)</div>
                <div class="dst-row">
                    <div class="dst-box">
                        <span class="dst-num" id="dst-days">00</span>
                        <span class="dst-label">Days</span>
                    </div>
                    <div class="dst-box">
                        <span class="dst-num" id="dst-hours">00</span>
                        <span class="dst-label">Hrs</span>
                    </div>
                    <div class="dst-box">
                        <span class="dst-num" id="dst-mins">00</span>
                        <span class="dst-label">Mins</span>
                    </div>
                    <div class="dst-box">
                        <span class="dst-num" id="dst-secs">00</span>
                        <span class="dst-label">Secs</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">16-Day Forecast Trend</div>
                <div class="graph-container">
                    <canvas id="hopeChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Upcoming Milestones</div>
                <ul class="future-list" id="milestones-list">
                    </ul>
            </div>

            <div class="footer-msg">
                v6.0 (DST Added)
            </div>
        </div>
    </div>

    <script>
        const LAT = 40.7128;
        const LON = -74.0060;
        const TIMEZONE = "America/New_York";

        /* --- DST COUNTDOWN LOGIC --- */
        function initDSTCountdown() {
            function updateTimer() {
                const now = new Date();
                const year = now.getFullYear();
                
                // DST Starts 2nd Sunday in March
                // 1. Find March 1st
                let dstDate = new Date(year, 2, 1); // Month 2 is March
                // 2. Find day of week (0 = Sunday)
                let day = dstDate.getDay();
                // 3. Calculate days to add to get to 1st Sunday
                let diff = (day === 0 ? 0 : 7 - day);
                // 4. Add 7 more days to get 2nd Sunday
                dstDate.setDate(dstDate.getDate() + diff + 7);
                // 5. Set time to 2:00 AM
                dstDate.setHours(2, 0, 0, 0);

                // If we passed DST this year, calculate for next year
                if (now > dstDate) {
                    dstDate = new Date(year + 1, 2, 1);
                    day = dstDate.getDay();
                    diff = (day === 0 ? 0 : 7 - day);
                    dstDate.setDate(dstDate.getDate() + diff + 7);
                    dstDate.setHours(2, 0, 0, 0);
                }

                const totalSecs = Math.floor((dstDate - now) / 1000);

                const d = Math.floor(totalSecs / 3600 / 24);
                const h = Math.floor(totalSecs / 3600) % 24;
                const m = Math.floor(totalSecs / 60) % 60;
                const s = Math.floor(totalSecs) % 60;

                document.getElementById('dst-days').innerText = d;
                document.getElementById('dst-hours').innerText = h < 10 ? '0'+h : h;
                document.getElementById('dst-mins').innerText = m < 10 ? '0'+m : m;
                document.getElementById('dst-secs').innerText = s < 10 ? '0'+s : s;
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        /* --- MILESTONE LOGIC --- */
        function generateMilestones() {
            const milestonesList = document.getElementById('milestones-list');
            const milestones = [];
            
            const now = new Date();
            const endDate = new Date(now.getFullYear(), 5, 22);
            if (now.getMonth() > 5) endDate.setFullYear(now.getFullYear() + 1);

            // Targets
            let sunsetTargets = [];
            for (let h = 16; h <= 20; h++) { 
                for (let m = 0; m < 60; m += 5) {
                    if (h === 16 && m < 30) continue; 
                    if (h === 20 && m > 45) continue;
                    let label = ((h > 12 ? h - 12 : h) + ":" + (m < 10 ? "0" + m : m) + " PM");
                    sunsetTargets.push({ hour: h, min: m, label: label, found: false });
                }
            }
            let sunriseTargets = [];
            for (let h = 7; h >= 5; h--) { 
                for (let m = 55; m >= 0; m -= 5) {
                    if (h === 7 && m > 45) continue; 
                    if (h === 5 && m < 15) continue;
                    let label = (h + ":" + (m < 10 ? "0" + m : m) + " AM");
                    sunriseTargets.push({ hour: h, min: m, label: label, found: false });
                }
            }

            // Yesterday Check
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            const yTimes = SunCalc.getTimes(yesterday, LAT, LON);
            const ySr = yTimes.sunrise.getHours() * 60 + yTimes.sunrise.getMinutes();
            const ySs = yTimes.sunset.getHours() * 60 + yTimes.sunset.getMinutes();

            sunsetTargets.forEach(t => { if (ySs >= (t.hour * 60 + t.min)) t.found = true; });
            sunriseTargets.forEach(t => { if (ySr <= (t.hour * 60 + t.min)) t.found = true; });

            // Future Scan
            let checkDate = new Date(now);
            let dayCount = 0;

            while (checkDate < endDate && dayCount < 200) {
                const times = SunCalc.getTimes(checkDate, LAT, LON);
                const sRise = times.sunrise;
                const sSet = times.sunset;
                const srMins = sRise.getHours() * 60 + sRise.getMinutes();
                const ssMins = sSet.getHours() * 60 + sSet.getMinutes();
                const isToday = (dayCount === 0);

                sunsetTargets.forEach(t => {
                    const tMins = t.hour * 60 + t.min;
                    if (ssMins >= tMins && !t.found) {
                        milestones.push({
                            date: isToday ? "Today" : checkDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
                            text: `Sunset after ${t.label}`,
                            icon: "🌇",
                            sortVal: dayCount * 10000 + ssMins
                        });
                        t.found = true; 
                    }
                });

                sunriseTargets.forEach(t => {
                    const tMins = t.hour * 60 + t.min;
                    if (srMins <= tMins && !t.found) {
                        milestones.push({
                            date: isToday ? "Today" : checkDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
                            text: `Sunrise before ${t.label}`,
                            icon: "🌅",
                            sortVal: dayCount * 10000 + srMins
                        });
                        t.found = true;
                    }
                });

                checkDate.setDate(checkDate.getDate() + 1);
                dayCount++;
            }

            // Render
            milestones.sort((a, b) => a.sortVal - b.sortVal);
            const finalMilestones = milestones.slice(0, 20); 

            if(finalMilestones.length === 0) {
                 milestonesList.innerHTML = `<li class="future-item"><span class="future-detail">Peak sunlight reached!</span></li>`;
            } else {
                finalMilestones.forEach(m => {
                    const li = document.createElement('li');
                    li.className = 'future-item';
                    li.innerHTML = `
                        <span class="future-date">${m.date}</span>
                        <div style="display:flex; align-items:center; justify-content:flex-end; flex-grow:1;">
                            <span class="icon">${m.icon}</span>
                            <span class="future-detail" style="text-align:right;">${m.text}</span>
                        </div>
                    `;
                    milestonesList.appendChild(li);
                });
            }
        }

        async function fetchWeather() {
            try {
                const ts = new Date().getTime();
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=temperature_2m_max&temperature_unit=fahrenheit&timeformat=unixtime&forecast_days=16&timezone=${TIMEZONE}&_=${ts}`);
                const data = await response.json();
                renderWeather(data);
            } catch (error) {
                console.error(error);
                document.getElementById('temp-today').innerText = "Offline";
            }
        }

        function renderWeather(data) {
            const daily = data.daily;
            document.getElementById('temp-today').innerText = Math.round(daily.temperature_2m_max[0]) + "°F";

            const ctx = document.getElementById('hopeChart').getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(253, 216, 53, 0.4)'); 
            gradient.addColorStop(1, 'rgba(253, 216, 53, 0.0)'); 

            const labels = daily.time.map(t => new Date(t*1000).getDate()); 
            const temps = daily.temperature_2m_max.map(t => Math.round(t));

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Max Temp (°F)',
                        data: temps,
                        borderColor: '#fdd835',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 3,
                        pointBackgroundColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { display: false, min: Math.min(...temps) - 5 }
                    },
                    layout: { padding: 10 }
                }
            });

            document.getElementById('loader').style.display = 'none';
            document.getElementById('app-content').style.display = 'flex';
        }

        function init() {
            const now = new Date();
            const times = SunCalc.getTimes(now, LAT, LON);
            const fmt = (date) => date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            document.getElementById('sun-today').innerText = `${fmt(times.sunrise)} / ${fmt(times.sunset)}`;

            const todayLen = (times.sunset - times.sunrise)/1000;
            const yest = new Date(now);
            yest.setDate(now.getDate() - 1);
            const yTimes = SunCalc.getTimes(yest, LAT, LON);
            const yLen = (yTimes.sunset - yTimes.sunrise)/1000;
            
            const diff = todayLen - yLen;
            const dM = Math.floor(diff / 60);
            const dS = Math.floor(diff % 60);
            document.getElementById('gain-text').innerText = `+${dM}m ${dS}s`;
            
            const h = Math.floor(todayLen / 3600);
            const m = Math.floor((todayLen % 3600) / 60);
            document.getElementById('daylight-total').innerText = `${h}h ${m}m`;

            generateMilestones();
            initDSTCountdown();
            fetchWeather();
        }

        init();
    </script>
</body>
</html>
